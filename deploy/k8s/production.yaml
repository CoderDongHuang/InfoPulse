apiVersion: v1
kind: Namespace
metadata: {name: infopulse}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: infopulse-config, namespace: infopulse}
data:
  ENVIRONMENT: production
  AUTO_CREATE_TABLES: "false"
  RUN_BACKGROUND_WORKERS_IN_API: "false"
  TASK_SCHEDULER_ENABLED: "true"
  KNOWLEDGE_STORAGE_BACKEND: s3
  CRAWLER_ENABLED: "true"
---
apiVersion: batch/v1
kind: Job
metadata: {name: preflight-VERSION, namespace: infopulse}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: preflight
          image: ghcr.io/codexdonghuang/infopulse:VERSION
          args: ["python","scripts/deployment_preflight.py"]
          envFrom: [{configMapRef: {name: infopulse-config}}, {secretRef: {name: infopulse-secrets}}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: migrate-VERSION, namespace: infopulse}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/codexdonghuang/infopulse:VERSION
          args: ["alembic","upgrade","head"]
          envFrom: [{configMapRef: {name: infopulse-config}}, {secretRef: {name: infopulse-secrets}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-stable, namespace: infopulse}
spec:
  replicas: 3
  selector: {matchLabels: {app: infopulse-api, track: stable}}
  template:
    metadata: {labels: {app: infopulse-api, track: stable}}
    spec:
      containers:
        - name: api
          image: ghcr.io/codexdonghuang/infopulse:VERSION
          args: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000","--workers","2","--proxy-headers","--forwarded-allow-ips","*"]
          envFrom:
            - configMapRef: {name: infopulse-config}
            - secretRef: {name: infopulse-secrets}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /api/v1/health/ready, port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /api/v1/health/live, port: http}, periodSeconds: 15, failureThreshold: 3}
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-canary, namespace: infopulse}
spec:
  replicas: 1
  selector: {matchLabels: {app: infopulse-api, track: canary}}
  template:
    metadata: {labels: {app: infopulse-api, track: canary}}
    spec:
      containers:
        - name: api
          image: ghcr.io/codexdonghuang/infopulse:CANARY_VERSION
          args: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000","--workers","2","--proxy-headers","--forwarded-allow-ips","*"]
          envFrom:
            - configMapRef: {name: infopulse-config}
            - secretRef: {name: infopulse-secrets}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /api/v1/health/ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/v1/health/live, port: http}, periodSeconds: 15}
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: infopulse
  labels: {app: infopulse-api-metrics}
spec: {selector: {app: infopulse-api, track: stable}, ports: [{port: 8000, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata: {name: api-canary, namespace: infopulse}
spec: {selector: {app: infopulse-api, track: canary}, ports: [{port: 8000, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: scheduler, namespace: infopulse}
spec:
  replicas: 2
  selector: {matchLabels: {app: infopulse-scheduler}}
  template:
    metadata: {labels: {app: infopulse-scheduler}}
    spec:
      containers:
        - name: worker
          image: ghcr.io/codexdonghuang/infopulse:VERSION
          args: ["python","-m","app.worker","--role","scheduler"]
          envFrom: [{configMapRef: {name: infopulse-config}}, {secretRef: {name: infopulse-secrets}}]
          resources: {requests: {cpu: 250m, memory: 384Mi}, limits: {cpu: "1", memory: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: knowledge-worker, namespace: infopulse}
spec:
  replicas: 2
  selector: {matchLabels: {app: infopulse-knowledge-worker}}
  template:
    metadata: {labels: {app: infopulse-knowledge-worker}}
    spec:
      containers:
        - name: worker
          image: ghcr.io/codexdonghuang/infopulse:VERSION
          args: ["python","-m","app.worker","--role","knowledge"]
          envFrom: [{configMapRef: {name: infopulse-config}}, {secretRef: {name: infopulse-secrets}}]
          resources: {requests: {cpu: 500m, memory: 768Mi}, limits: {cpu: "2", memory: 2Gi}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api-stable, namespace: infopulse}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api-stable}
  minReplicas: 3
  maxReplicas: 12
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
  behavior: {scaleDown: {stabilizationWindowSeconds: 300}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api-stable, namespace: infopulse}
spec: {minAvailable: 2, selector: {matchLabels: {app: infopulse-api, track: stable}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: infopulse}
spec:
  replicas: 2
  selector: {matchLabels: {app: infopulse-web}}
  template:
    metadata: {labels: {app: infopulse-web}}
    spec:
      containers:
        - name: web
          image: ghcr.io/codexdonghuang/infopulse-web:VERSION
          ports: [{name: http, containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 96Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: infopulse}
spec: {selector: {app: infopulse-web}, ports: [{port: 80, targetPort: http}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: infopulse
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  tls: [{hosts: [app.example.com], secretName: infopulse-web-tls}]
  rules: [{host: app.example.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]}}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-stable
  namespace: infopulse
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
spec:
  ingressClassName: nginx
  tls: [{hosts: [api.example.com], secretName: infopulse-api-tls}]
  rules: [{host: api.example.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: backend, port: {number: 8000}}}}]}}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-canary
  namespace: infopulse
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  ingressClassName: nginx
  rules: [{host: api.example.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: api-canary, port: {number: 8000}}}}]}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: infopulse}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-controller, namespace: infopulse}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [infopulse-api, infopulse-web]}]}
  policyTypes: [Ingress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]}]
