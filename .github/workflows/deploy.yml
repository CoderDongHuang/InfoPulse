name: Deploy Staging or Production

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        required: true
      version:
        description: Immutable image tag or commit SHA
        required: true
      canary_weight:
        type: choice
        options: [0, 5, 10, 25]
        default: 10

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - uses: azure/setup-kubectl@v5
      - name: Validate immutable version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -c 'import os,re; v=os.environ["RELEASE_VERSION"]; assert len(v)<=40 and re.fullmatch(r"[a-z0-9][a-z0-9.-]*",v), "Invalid release version"'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable images
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          docker build -t "ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_VERSION" backend
          docker build -t "ghcr.io/${GITHUB_REPOSITORY,,}-web:$RELEASE_VERSION" frontend
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_VERSION"
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}-web:$RELEASE_VERSION"
      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube
          echo '${{ secrets.KUBE_CONFIG }}' | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Render release phases
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          API_HOST: ${{ vars.API_HOST }}
          APP_HOST: ${{ vars.APP_HOST }}
        run: |
          for phase in bootstrap preflight migrate canary promote; do
            python deploy/scripts/render_manifests.py --source deploy/k8s/production.yaml --output /tmp/release-$phase.yaml --phase "$phase" --version "$RELEASE_VERSION" --canary-version "$RELEASE_VERSION" --repository "${GITHUB_REPOSITORY,,}" --api-host "$API_HOST" --app-host "$APP_HOST"
          done
      - name: Bootstrap immutable release config
        run: kubectl apply -f /tmp/release-bootstrap.yaml
      - name: Verify required secret exists
        run: kubectl -n infopulse get secret infopulse-secrets
      - name: Verify shared export storage
        run: |
          kubectl -n infopulse get pvc infopulse-exports -o json > /tmp/export-pvc.json
          python -c 'import json; p=json.load(open("/tmp/export-pvc.json")); assert "ReadWriteMany" in p["spec"]["accessModes"], "Exports require RWX storage"; assert p["status"]["phase"] == "Bound", "Export volume must be bound"'
      - name: Snapshot running application resources
        run: kubectl -n infopulse get deployment,service,ingress,networkpolicy,hpa,pdb -o json > /tmp/previous-release.json
      - name: Preflight gate
        run: |
          kubectl apply -f /tmp/release-preflight.yaml
          kubectl -n infopulse wait --for=condition=complete --timeout=180s job/preflight-${{ inputs.version }}
      - name: Migration gate
        run: |
          kubectl apply -f /tmp/release-migrate.yaml
          kubectl -n infopulse wait --for=condition=complete --timeout=300s job/migrate-${{ inputs.version }}
      - name: Deploy isolated canary
        run: |
          kubectl apply -f /tmp/release-canary.yaml
          kubectl -n infopulse rollout status deployment/api-canary --timeout=300s
      - name: Verify exact canary deployment
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          expected="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_VERSION"
          actual=$(kubectl -n infopulse get deployment api-canary -o jsonpath='{.spec.template.spec.containers[0].image}')
          test "$actual" = "$expected"
          kubectl -n infopulse port-forward service/api-canary 18080:8000 > /tmp/canary-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Set verified canary traffic
        run: kubectl -n infopulse annotate ingress api-canary nginx.ingress.kubernetes.io/canary-weight="${{ inputs.canary_weight }}" --overwrite
      - name: Promote application and all workers
        run: |
          kubectl apply -f /tmp/release-promote.yaml
          for name in api-stable web scheduler knowledge-worker orchestration-worker media-worker sources-worker actions-worker; do
            kubectl -n infopulse rollout status deployment/$name --timeout=300s
          done
          kubectl -n infopulse annotate ingress api-canary nginx.ingress.kubernetes.io/canary-weight="0" --overwrite
      - name: Restore previous application resources
        if: failure()
        run: |
          if test -s /tmp/previous-release.json; then
            python deploy/scripts/rollback_release.py --snapshot /tmp/previous-release.json
          fi
