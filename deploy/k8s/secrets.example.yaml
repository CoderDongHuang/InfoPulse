apiVersion: v1
kind: Secret
metadata: {name: infopulse-secrets, namespace: infopulse}
type: Opaque
stringData:
  DATABASE_URL: REPLACE_IN_SECRET_MANAGER
  REDIS_URL: REPLACE_IN_SECRET_MANAGER
  JWT_SECRET_KEY: REPLACE_IN_SECRET_MANAGER
  SSO_PROXY_SECRET: REPLACE_IN_SECRET_MANAGER
  PLATFORM_ENCRYPTION_KEY: REPLACE_IN_SECRET_MANAGER
  METRICS_TOKEN: REPLACE_IN_SECRET_MANAGER
  ADMIN_EMAILS: '["admin@example.com"]'
  CORS_ORIGINS: '["https://app.example.com"]'
  TRUSTED_HOSTS: '["api.example.com"]'
  S3_ENDPOINT_URL: REPLACE_IN_SECRET_MANAGER
  S3_BUCKET: infopulse-knowledge
  S3_ACCESS_KEY: REPLACE_IN_SECRET_MANAGER
  S3_SECRET_KEY: REPLACE_IN_SECRET_MANAGER
  SMTP_HOST: REPLACE_IN_SECRET_MANAGER
  SMTP_USERNAME: REPLACE_IN_SECRET_MANAGER
  SMTP_PASSWORD: REPLACE_IN_SECRET_MANAGER
  SMTP_FROM: REPLACE_IN_SECRET_MANAGER
  LLM_API_KEY: REPLACE_IN_SECRET_MANAGER
  LLM_API_BASE: https://api.openai.com/v1
  LLM_MODEL: REPLACE_WITH_APPROVED_MODEL
  GITHUB_TOKEN: REPLACE_IN_SECRET_MANAGER
