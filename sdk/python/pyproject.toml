[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "infopulse-sdk"
version = "0.1.0"
description = "Official Python client for the InfoPulse Open Platform"
requires-python = ">=3.10"
[tool.setuptools.packages.find]
where = ["."]
include = ["infopulse_sdk*"]
