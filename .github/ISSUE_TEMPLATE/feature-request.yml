name: Feature request
description: Propose a focused improvement with a clear learning or user outcome.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        InfoPulse 优先保持公开数据链路可解释、可复现。涉及第三方凭据或公网部署的提案请说明验证边界。
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked the roadmap and capability matrix.
          required: true
        - label: I will not include secrets or unauthorized data collection.
          required: true
