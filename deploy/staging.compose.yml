services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: infopulse
      POSTGRES_USER: infopulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging-only-password}
    volumes: [staging_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infopulse -d infopulse"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [staging_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-staging-access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-staging-secret-change-me}
    volumes: [staging_s3:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY && mc mb --ignore-existing local/infopulse-knowledge"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-staging-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-staging-secret-change-me}

  migrate:
    build: {context: ../backend, dockerfile: Dockerfile}
    command: ["alembic", "upgrade", "head"]
    env_file: [.env.staging]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: {context: ../backend, dockerfile: Dockerfile}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: [.env.staging]
    environment:
      RUN_BACKGROUND_WORKERS_IN_API: "false"
      KNOWLEDGE_STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      default:
        aliases: [backend]

  scheduler:
    build: {context: ../backend, dockerfile: Dockerfile}
    command: ["python", "-m", "app.worker", "--role", "scheduler"]
    env_file: [.env.staging]
    environment: {RUN_BACKGROUND_WORKERS_IN_API: "false"}
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped

  knowledge-worker:
    build: {context: ../backend, dockerfile: Dockerfile}
    command: ["python", "-m", "app.worker", "--role", "knowledge"]
    env_file: [.env.staging]
    environment:
      RUN_BACKGROUND_WORKERS_IN_API: "false"
      KNOWLEDGE_STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
    restart: unless-stopped

  web:
    build: {context: ../frontend, dockerfile: Dockerfile}
    ports: ["8080:80"]
    depends_on: {api: {condition: service_healthy}}

volumes:
  staging_postgres:
  staging_redis:
  staging_s3:
